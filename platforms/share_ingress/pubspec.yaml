name: share_ingress
description: iOS Share Extension and Android share ingress shell for Video Sniffing.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.videosniffing.share_ingress
        pluginClass: ShareIngressPlugin
      ios:
        pluginClass: ShareIngressPlugin
