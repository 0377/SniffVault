name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-check
        with:
          run-fmt: "true"
          run-test: "false"
          run-clippy: "false"

  test-clippy:
    name: test-clippy (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-check
        with:
          run-fmt: "false"
          run-test: "true"
          run-clippy: "true"

  flutter-smoke:
    name: flutter-smoke
    needs: fmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch bundled ffmpeg for HLS tests
        run: bash engine/scripts/fetch_ffmpeg.sh

      - name: Verify Rust FFI symlink
        run: test -L app/rust || test -d app/rust_builder/rust

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter test and integration smoke
        run: |
          cd app
          flutter pub get
          flutter test
          flutter test integration_test/smoke_test.dart -d macos
