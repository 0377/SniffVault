[package]
name = "video_sniffing_engine_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
video_sniffing_engine = { path = "../" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
allo-isolate = "0.1"

[dev-dependencies]
tempfile = "3"
axum = "0.7"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = "0.1"
