<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="&#x55c5;&#x5f71;&#x5e93;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1F5E"/>
      <stop offset="55%" stop-color="#4C35A8"/>
      <stop offset="100%" stop-color="#7B5CF6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1A1240" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App icon canvas -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="512" rx="224" fill="url(#shine)"/>

  <!-- Sniff waves -->
  <g fill="none" stroke="#C4B5FD" stroke-width="28" stroke-linecap="round" opacity="0.9">
    <path d="M 198 286 C 286 198, 430 198, 518 286"/>
    <path d="M 150 338 C 270 218, 446 218, 566 338"/>
    <path d="M 102 390 C 254 238, 462 238, 614 390"/>
  </g>

  <!-- Film library card -->
  <g filter="url(#soft)">
    <rect x="286" y="300" width="452" height="424" rx="56" fill="#F8F7FF"/>
    <rect x="334" y="348" width="356" height="236" rx="28" fill="#2B1F5E"/>
    <polygon points="470,466 470,566 566,516" fill="#F8F7FF"/>

    <!-- Film perforations -->
    <g fill="#D9D2FF">
      <rect x="310" y="372" width="18" height="36" rx="6"/>
      <rect x="310" y="432" width="18" height="36" rx="6"/>
      <rect x="310" y="492" width="18" height="36" rx="6"/>
      <rect x="694" y="372" width="18" height="36" rx="6"/>
      <rect x="694" y="432" width="18" height="36" rx="6"/>
      <rect x="694" y="492" width="18" height="36" rx="6"/>
    </g>

    <!-- Shelf base -->
    <rect x="334" y="612" width="356" height="20" rx="10" fill="#DDD6FE"/>
    <rect x="366" y="648" width="292" height="28" rx="14" fill="#C4B5FD"/>
  </g>

  <!-- Captured stream dot -->
  <circle cx="760" cy="760" r="34" fill="#A78BFA"/>
  <circle cx="760" cy="760" r="16" fill="#F8F7FF"/>
</svg>
